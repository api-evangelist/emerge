certifications_note: >-
  The trust center exists and resolves under Emerge's own domain, but its contents are rendered
  entirely client-side by the Vanta trust-report SPA. Every path under trust.emergemarket.com
  (including /api/trust-report and /trust-report.json) returns the same HTML shell, so no named
  certification (SOC 2, ISO 27001, ISO 27017/27018, PCI DSS, HIPAA, FedRAMP, GDPR, CSA STAR) could
  be read anonymously. Certifications are recorded as an empty list — checked, nothing verifiable —
  NOT as an assertion that Emerge holds none. No `type: Compliance` pointer is emitted, because that
  check asserts a published, verifiable compliance program.
