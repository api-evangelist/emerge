    Emerge Public API (Shipper API): 1.2.1
    Emerge Carrier API: 2.0.0
  docs: https://api-docs.emergemarket.io/#section/Get-Started/Compatibility-Policy
  policy: >-
    Emerge APIs are versioned with a prefix in the endpoint URL. Within a version only
    backward-compatible changes are made; an incompatible change creates a new version.
  non_breaking_changes:
  - Adding additional optional fields on the API request
  - Adding additional fields on the API response
  - Adding an HTTP method to an API
  - Adding optional headers
  - Adding additional accepted enumerated values
  - Changing Error Response descriptions
  - Adding Rate Limits
  breaking_changes:
  - Removing or renaming an API method or endpoint
  - Removing or renaming existing API request or response fields
  - Removing or renaming enumerated values
  - Changing the Error Response values
deprecation:
  policy_url: https://api-docs.emergemarket.io/#section/Get-Started/Compatibility-Policy
  support_window: 1 year
  policy: >-
    Emerge continues to support deprecated APIs for one year. Documentation is updated and
    integrating providers are notified by email when a version or endpoint is being deprecated.
  notification_channel: email to integrating providers
  sunset_header: false
  deprecation_header: false
  rfc8594: false
