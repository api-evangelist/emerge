apis:
- name: Emerge Public API (Shipper API)
  description: >-
    REST API giving partner developers and shipper TMS platforms access to the core Emerge shipper
    workflow: create and manage opportunities, post them to the Emerge Marketplace or to network
    partners, retrieve carrier options, create awards, tender to a carrier, track shipments, manage
    network partners, and subscribe to webhook events. Supports the opportunity-to-tender and
    opportunity-to-award workflows. Bearer token auth via a username/password login exchange.
  humanURL: https://api-docs.emergemarket.io/
  baseURL: https://api.emergemarket.io/v1
