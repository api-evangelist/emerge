- name: Emerge Carrier API
  description: >-
    REST API for Capacity and Integration Providers (carriers, brokers and their TMS vendors) working
    with shippers on the Emerge platform. Providers receive Rate Request and Tender Request events by
    webhook, then respond with a quote (creating an Option for the shipper) or a tender response.
    Authenticates with a client id / client secret credential pair exchanged for a bearer token. Part
    of the Capacity Link program.
  humanURL: https://carrier-api-docs.emergemarket.io/
  baseURL: https://api.emergemarket.io/v2
