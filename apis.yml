- aid: emerge:emerge-webhooks-api
  name: Emerge Webhooks API
  description: "Webhooks are used to provide updates to the TMS when award or option events are generated\
    \ within the Emerge system.\n</br></br>If our webhook message cannot be accepted by the webhook endpoint\
    \ due to network failures, server errors, or request timeouts we will attempt delivering the message\
    \ again. We will retry sending the message 6 times with varying gaps of time. \nSee table below:\n\
    <table>\n<tr>\n<th>Retry Count</th>\n<th>Time</th>\n</tr>\n<tr>\n<td>1</td>\n<td>1 second from initial\
    \ attempt</td>\n</tr>\n<tr>\n<td>2</td>\n<td>4 seconds from first attempt</td>\n</tr>\n<tr>\n<td>3</td>\n\
    <td>9 seconds from second  attempt</td>\n</tr>\n<tr>\n<td>4</td>\n<td>16 seconds from third attempt</td>\n\
    </tr>\n<tr>\n<td>5</td>\n<td>25 seconds from fourth attempt</td>\n</tr>\n<tr>\n<td>6</td>\n<td>36\
    \ seconds from fifth attempt</td>\n</tr>\n</table>"
  humanURL: https://api-docs.emergemarket.io/
  baseURL: https://api.emergemarket.io/v1
