aid: emerge
name: Emerge
description: >-
  Emerge (EmergeTech, Inc.) is a Scottsdale, Arizona freight procurement and transportation spend
  management platform — marketed as ProcureOS — that moves full truckload, volume/partial truckload
  and drop-trailer freight sourcing out of spreadsheets and email into a single system. The platform
  combines contract procurement (annual RFPs, mini-bids, awarding scenarios, carrier scorecards),
  spot procurement (quoting, tendering, Dynamic Book It Now, tracking and visibility), Emerge AI rate
  benchmarking and lane intelligence (Rate Pulse), and the Emerge Marketplace of 45,000+ pre-vetted
  asset-based carriers across the US, Canada and Mexico. Emerge publishes two public REST APIs — a
  Shipper (public) API for opportunities, options, awards, tenders, shipments, network partners and
  webhook subscriptions, and a Carrier API for capacity/integration providers responding to rate
  requests and tenders — plus a documented webhook event catalog, a testing sandbox, and TMS
  integrations with Project44, E2open, MercuryGate and Capacity Link partners.
