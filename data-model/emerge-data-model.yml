note: >-
  Entity graph derived from the OpenAPI component schemas and their id-reference fields. Emerge's
  domain vocabulary is published in the Carrier API introduction: a shipper creates an
  "Opportunity"; a Capacity Provider answers a rate request with a "Quote", which becomes an
  "Option" for the shipper; the shipper "Awards" and then "Tenders" to a carrier; execution and
  tracking happen on a "Shipment".
identifiers:
  style: integer and GUID `id` fields per entity, plus caller-supplied references
  caller_supplied:
  - customer_reference_number (addressable: DELETE /opportunities/by_customer_reference/{customer_reference_number})
  - references / reference_type_object on opportunities, tenders and carrier events
  - provider_reference (carrier quote id echoed back on POST /options)
  - relationship_identifiers (Capacity Link onboarding values carried on rate_request events)
