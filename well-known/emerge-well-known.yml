  (identical 73-byte document, Contact + Expires only). No other /.well-known/ document is served.
  The apex/www marketing host (www.emergemarket.com, Webflow) answers 404 with an "Invalid
  .well-known" HTML stub for every path. The app console (app.emergemarket.io) and both Redoc docs
  hosts (api-docs / carrier-api-docs) are SPA/static catch-alls that answer 200 with an HTML shell
  for ANY /.well-known/* path — those 200s are NOT documents and are recorded here as misses so
  they are never mistaken for a served surface.
